/* =========================================================
   TYPING EFFECT
========================================================= */

const typingText = "Web developer/app developer and Ai intern";
let typingIndex = 0;

function typeEffect() {

    const target = document.querySelector('.hero-text p');

    if (!target) return;

    target.textContent = '';

    const interval = setInterval(() => {

        if (typingIndex < typingText.length) {

            target.textContent += typingText.charAt(typingIndex);
            typingIndex++;

        } else {

            clearInterval(interval);

        }

    }, 100);
}

if (document.readyState === 'loading') {

    document.addEventListener('DOMContentLoaded', typeEffect);

} else {

    typeEffect();

}


/* =========================================================
   JAYWEBDEV AI ASSISTANT
========================================================= */

(function () {

    const toggleBtn = document.getElementById('jay-ai-toggle');
    const chatBox = document.getElementById('jay-ai-chat');
    const closeBtn = document.getElementById('jay-ai-close');
    const messages = document.getElementById('jay-ai-messages');
    const input = document.getElementById('jay-ai-input');
    const sendBtn = document.getElementById('jay-ai-send');

    if (
        !toggleBtn ||
        !chatBox ||
        !closeBtn ||
        !messages ||
        !input ||
        !sendBtn
    ) {
        return;
    }


    /* =======================================================
       PAGE LOCK / MOBILE VIEWPORT CONTROL
    ======================================================= */

    let savedScrollPosition = 0;
    let pageIsLocked = false;
    let keyboardIsOpen = false;

    let originalBodyHeight = '';
    let originalBodyMinHeight = '';
    let originalBodyMaxHeight = '';

    let originalHtmlHeight = '';
    let originalHtmlMinHeight = '';
    let originalHtmlMaxHeight = '';


    function getViewportHeight() {

        if (window.visualViewport) {
            return window.visualViewport.height;
        }

        return window.innerHeight;
    }


    /* =======================================================
       LOCK PAGE
    ======================================================= */

    function lockPage() {

        if (pageIsLocked) return;

        savedScrollPosition = window.scrollY;

        originalBodyHeight = document.body.style.height;
        originalBodyMinHeight = document.body.style.minHeight;
        originalBodyMaxHeight = document.body.style.maxHeight;

        originalHtmlHeight = document.documentElement.style.height;
        originalHtmlMinHeight = document.documentElement.style.minHeight;
        originalHtmlMaxHeight = document.documentElement.style.maxHeight;


        document.body.style.position = 'fixed';

        document.body.style.top =
            `-${savedScrollPosition}px`;

        document.body.style.left = '0';
        document.body.style.right = '0';
        document.body.style.width = '100%';

        document.body.style.overflow = 'hidden';

        document.documentElement.style.overflow = 'hidden';


        document.body.classList.add('ai-chat-open');

        pageIsLocked = true;
    }


    /* =======================================================
       REDUCE PAGE HEIGHT WHEN KEYBOARD OPENS
    ======================================================= */

    function reducePageToViewport() {

        if (!pageIsLocked) return;

        const viewportHeight = getViewportHeight();

        /*
         * IMPORTANT:
         * Make the actual page no taller than the visible
         * viewport while the keyboard is open.
         */

        document.documentElement.style.height =
            `${viewportHeight}px`;

        document.documentElement.style.minHeight =
            `${viewportHeight}px`;

        document.documentElement.style.maxHeight =
            `${viewportHeight}px`;


        document.body.style.height =
            `${viewportHeight}px`;

        document.body.style.minHeight =
            `${viewportHeight}px`;

        document.body.style.maxHeight =
            `${viewportHeight}px`;

        document.body.style.overflow = 'hidden';


        /*
         * Tell the page that the keyboard is active.
         */

        document.body.classList.add('ai-keyboard-open');

        keyboardIsOpen = true;
    }


    /* =======================================================
       RESTORE PAGE HEIGHT
    ======================================================= */

    function restorePageHeight() {

        document.body.classList.remove('ai-keyboard-open');

        document.documentElement.style.height =
            originalHtmlHeight;

        document.documentElement.style.minHeight =
            originalHtmlMinHeight;

        document.documentElement.style.maxHeight =
            originalHtmlMaxHeight;


        document.body.style.height =
            originalBodyHeight;

        document.body.style.minHeight =
            originalBodyMinHeight;

        document.body.style.maxHeight =
            originalBodyMaxHeight;

        keyboardIsOpen = false;
    }


    /* =======================================================
       UNLOCK PAGE
    ======================================================= */

    function unlockPage() {

        if (!pageIsLocked) return;

        document.body.classList.remove('ai-chat-open');
        document.body.classList.remove('ai-keyboard-open');


        document.body.style.position = '';
        document.body.style.top = '';
        document.body.style.left = '';
        document.body.style.right = '';
        document.body.style.width = '';
        document.body.style.overflow = '';


        restorePageHeight();


        document.documentElement.style.overflow = '';


        window.scrollTo(
            0,
            savedScrollPosition
        );


        pageIsLocked = false;
    }


    /* =======================================================
       OPEN CHAT
    ======================================================= */

    function openChat() {

        chatBox.classList.remove('hidden');

        lockPage();

        messages.scrollTop =
            messages.scrollHeight;
    }


    /* =======================================================
       CLOSE CHAT
    ======================================================= */

    function closeChat() {

        if (document.activeElement === input) {

            input.blur();

        }

        chatBox.classList.add('hidden');

        unlockPage();
    }


    /* =======================================================
       OPEN / CLOSE TOGGLE
    ======================================================= */

    toggleBtn.addEventListener('click', () => {

        if (chatBox.classList.contains('hidden')) {

            openChat();

        } else {

            closeChat();

        }

    });


    /* =======================================================
       CLOSE BUTTON
    ======================================================= */

    closeBtn.addEventListener('click', () => {

        closeChat();

    });


    /* =======================================================
       INPUT FOCUS
       
       THIS IS THE IMPORTANT PART
    ======================================================= */

    input.addEventListener('focus', () => {

        /*
         * Only apply this behavior on phones/tablets.
         */

        if (window.innerWidth > 768) {
            return;
        }


        /*
         * Wait for Android Chrome to resize the
         * visual viewport after the keyboard appears.
         */

        setTimeout(() => {

            reducePageToViewport();

        }, 100);


        setTimeout(() => {

            reducePageToViewport();

        }, 300);


        setTimeout(() => {

            reducePageToViewport();

        }, 600);

    });


    /* =======================================================
       INPUT BLUR
    ======================================================= */

    input.addEventListener('blur', () => {

        if (window.innerWidth > 768) {
            return;
        }


        setTimeout(() => {

            /*
             * Only restore if keyboard has actually closed.
             */

            const viewportHeight =
                getViewportHeight();

            const screenHeight =
                window.screen.height;


            /*
             * If viewport is close to the normal
             * screen height, keyboard is gone.
             */

            if (
                viewportHeight >
                screenHeight * 0.75
            ) {

                restorePageHeight();

            }

        }, 300);

    });


    /* =======================================================
       VISUAL VIEWPORT
       
       Detect Android keyboard resizing
    ======================================================= */

    if (window.visualViewport) {

        window.visualViewport.addEventListener(
            'resize',
            () => {

                if (!pageIsLocked) {
                    return;
                }


                /*
                 * NEVER allow the background page
                 * to move.
                 */

                document.body.style.top =
                    `-${savedScrollPosition}px`;


                /*
                 * When keyboard is active,
                 * reduce page height to exactly
                 * the visible viewport.
                 */

                if (
                    document.activeElement === input &&
                    window.innerWidth <= 768
                ) {

                    reducePageToViewport();

                }

            }
        );


        window.visualViewport.addEventListener(
            'scroll',
            () => {

                if (!pageIsLocked) {
                    return;
                }


                /*
                 * Prevent visual viewport movement
                 * from moving the portfolio.
                 */

                document.body.style.top =
                    `-${savedScrollPosition}px`;

            }
        );

    }


    /* =======================================================
       ADD MESSAGE
    ======================================================= */

    function addMessage(text, type, id) {

        const div =
            document.createElement('div');


        div.className =
            type === 'user'
                ? 'jay-ai-user'
                : 'jay-ai-bot';


        if (id) {

            div.id = id;

        }


        div.innerHTML = text;

        messages.appendChild(div);


        requestAnimationFrame(() => {

            messages.scrollTop =
                messages.scrollHeight;

        });


        return div;
    }


    /* =======================================================
       REMOVE MESSAGE
    ======================================================= */

    function removeMessage(id) {

        const element =
            document.getElementById(id);


        if (element) {

            element.remove();

        }

    }


    /* =======================================================
       SEND MESSAGE
    ======================================================= */

    function sendMessage() {

        const text =
            input.value.trim();


        if (!text) return;


        addMessage(
            text,
            'user'
        );


        input.value = '';


        processQuestion(text);
    }


    /* =======================================================
       SEND BUTTON
    ======================================================= */

    sendBtn.addEventListener(
        'click',
        () => {

            sendMessage();

        }
    );


    /* =======================================================
       ENTER KEY
    ======================================================= */

    input.addEventListener(
        'keydown',
        (event) => {

            if (event.key === 'Enter') {

                event.preventDefault();

                sendMessage();

            }

        }
    );


    /* =======================================================
       PROCESS QUESTION
    ======================================================= */

    function processQuestion(question) {

        const thinkingId =
            'jay-ai-thinking';


        addMessage(
            'Thinking...',
            'bot',
            thinkingId
        );


        const delay =
            650 +
            Math.floor(
                Math.random() * 550
            );


        setTimeout(() => {

            removeMessage(
                thinkingId
            );


            const reply =
                getReply(question);


            addMessage(
                reply,
                'bot'
            );

        }, delay);
    }


    /* =======================================================
       AI RESPONSES
    ======================================================= */

    function getReply(question) {

        const q =
            question

        /* GREETINGS */

        ) {

            return 'Good day! How can I help you?';

        }


        /* WHO ARE YOU */

        if (
            /(who are you|what are you|who'?s this|what is this|are you a bot|are you ai|are you real)/i.test(q)
        ) {

        }


        /* WHO IS JAY */

        if (

            return 'Jay is a professional web, app, and AI developer. He builds websites, web applications, mobile apps, custom software, and AI-powered solutions.';

        }


        /* WHAT DOES JAY DO */

        if (

            return 'Jay works with HTML, CSS, JavaScript, React, Next.js, PHP, MySQL, and Python. He builds websites, web apps, applications, software, and AI-powered solutions.';

        }


        /* PROFESSIONAL */

        if (
            /(is jay|are you).*(developer|programmer|skilled|professional|good|experienced)/i.test(q)
        ) {

            return 'Yes. Jay is a professional developer who builds modern websites, applications, software, and AI-powered solutions.';

        }


        if (
            /(professional|good|skilled|experienced|expert|reliable)/i.test(q)
        ) {

            return 'Yes. Jay is a professional developer who builds modern websites, applications, software, and AI-powered solutions.';

        }


/* =========================================================
   PROJECTS / PORTFOLIO
========================================================= */

if (
    /(project|projects|portfolio|work|works|built|builds|website.*built|app.*built|what.*built|what.*made|show.*work|show.*project|see.*work|see.*project|previous.*work|past.*work)/i.test(q)
) {

    return `
        <div>
            <strong>Jay's Projects</strong><br><br>

            You can explore Jay's projects, previous work, and development experience on the About page.<br><br>

            <a href="services.html"

               ">
                View Projects →

}


        /* WEBSITE */

        if (

        if (

        }


        /* PRICING */

        if (

        ) {

        if (

        if (

        }


        /* HIRE */

        if (

        ) {

            return 'Sure. Please go to the Contact page and leave a message with your project details.';

        }


        /* CONTACT */

if (
    /(contact|reach|email|message|available|availability|free|how.*(contact|reach))/i.test(q)
) {

    return `
        <div>
            Please go to the Contact page and leave a message with your requirements.<br><br>

            <a href="contact.html"
               style="
                   display:inline-block;
                   padding:9px 14px;
                   background:#00eaff;

        /* BUSINESS */

        if (

        if (

        /* DEFAULT */

        return 'Please go to the Contact page and leave a message. Jay will be able to assist you there.';

    }


    /* =======================================================
       PREVENT BACKGROUND TOUCH SCROLL
    ======================================================= */

    document.addEventListener(
        'touchmove',
        (event) => {

            if (!pageIsLocked) {
                return;
            }


            /*
             * Allow the AI message area to scroll.
             */

            if (
                event.target.closest(
                    '#jay-ai-messages'
                )
            ) {

                return;

            }


            /*
             * Don't allow the portfolio
             * background to scroll.
             */

            if (
                !event.target.closest(
                    '#jay-ai-chat'
                )
            ) {

                event.preventDefault();

            }

        },
        {
            passive: false
        }
    );


    /* =======================================================
       ESCAPE KEY
    ======================================================= */

    document.addEventListener(
        'keydown',
        (event) => {

            if (event.key === 'Escape') {

                if (
                    !chatBox.classList.contains(
                        'hidden'
                    )
                ) {

                    closeChat();

                }

            }

        }
    );


})();
</script>

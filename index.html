<script>
/* =========================================================
   MOBILE MENU
========================================================= */
const menuBtn = document.querySelector('.menu-btn');
const nav = document.querySelector('nav');

if (menuBtn && nav) {
    menuBtn.addEventListener('click', () => {
        nav.classList.toggle('active');
    });
}

/* =========================================================
   TYPING EFFECT
========================================================= */
const typingText = "Web developer/app developer and Ai intern";
let typingIndex = 0;

function typeEffect() {
    const target = document.querySelector('.hero-text p');
    if (!target) return;

    target.textContent = '';

    const interval = setInterval(() => {
        if (typingIndex < typingText.length) {
            target.textContent += typingText.charAt(typingIndex);
            typingIndex++;
        } else {
            clearInterval(interval);
        }
    }, 100);
}

if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', typeEffect);
} else {
    typeEffect();
}

/* =========================================================
   JAYWEBDEV AI ASSISTANT
========================================================= */
(function () {
    const toggleBtn = document.getElementById('jay-ai-toggle');
    const chatBox = document.getElementById('jay-ai-chat');
    const closeBtn = document.getElementById('jay-ai-close');
    const messages = document.getElementById('jay-ai-messages');
    const input = document.getElementById('jay-ai-input');
    const sendBtn = document.getElementById('jay-ai-send');

    if (!toggleBtn || !chatBox || !closeBtn || !messages || !input || !sendBtn) {
        return;
    }

    /* =========================================================
       MOVE AI CHAT WINDOW ON MOBILE
    ========================================================= */
    let chatDragging = false;
    let chatStartX = 0;
    let chatStartY = 0;
    let chatStartLeft = 0;
    let chatStartTop = 0;

    function isMobileChat() {
        return window.innerWidth <= 768;
    }

    chatBox.addEventListener('pointerdown', (event) => {
        if (!isMobileChat()) return;

        if (
            event.target.closest('#jay-ai-input') ||
            event.target.closest('#jay-ai-send') ||
            event.target.closest('#jay-ai-close') ||
            event.target.closest('#jay-ai-messages')
        ) {
            return;
        }

        chatDragging = true;
        chatBox.classList.add('dragging');

        const rect = chatBox.getBoundingClientRect();
        chatStartX = event.clientX;
        chatStartY = event.clientY;
        chatStartLeft = rect.left;
        chatStartTop = rect.top;

        chatBox.style.left = `${chatStartLeft}px`;
        chatBox.style.top = `${chatStartTop}px`;
        chatBox.style.right = 'auto';
        chatBox.style.bottom = 'auto';
        chatBox.style.transform = 'none';

        chatBox.setPointerCapture(event.pointerId);
        event.preventDefault();
    });

    chatBox.addEventListener('pointermove', (event) => {
        if (!chatDragging || !isMobileChat()) return;

        const moveX = event.clientX - chatStartX;
        const moveY = event.clientY - chatStartY;

        let newLeft = chatStartLeft + moveX;
        let newTop = chatStartTop + moveY;

        const chatWidth = chatBox.offsetWidth;
        const chatHeight = chatBox.offsetHeight;

        const maxLeft = window.innerWidth - chatWidth;
        const maxTop = window.innerHeight - chatHeight;

        newLeft = Math.max(0, Math.min(newLeft, maxLeft));
        newTop = Math.max(0, Math.min(newTop, maxTop));

        chatBox.style.left = `${newLeft}px`;
        chatBox.style.top = `${newTop}px`;
    });

    function stopChatDragging(event) {
        if (!chatDragging) return;

        chatDragging = false;
        chatBox.classList.remove('dragging');

        try {
            chatBox.releasePointerCapture(event.pointerId);
        } catch (error) {}
    }

    chatBox.addEventListener('pointerup', stopChatDragging);
    chatBox.addEventListener('pointercancel', stopChatDragging);

    window.addEventListener('resize', () => {
        if (!isMobileChat()) return;
        if (chatBox.classList.contains('hidden')) return;

        const rect = chatBox.getBoundingClientRect();
        const maxLeft = window.innerWidth - chatBox.offsetWidth;
        const maxTop = window.innerHeight - chatBox.offsetHeight;

        chatBox.style.left = `${Math.max(0, Math.min(rect.left, maxLeft))}px`;
        chatBox.style.top = `${Math.max(0, Math.min(rect.top, maxTop))}px`;
    });

    /* =======================================================
       OPEN / CLOSE CHAT  (NO PAGE LOCK)
    ======================================================= */
    function openChat() {
        chatBox.classList.remove('hidden');
        messages.scrollTop = messages.scrollHeight;
    }

    function closeChat() {
        if (document.activeElement === input) {
            input.blur();
        }
        chatBox.classList.add('hidden');
    }

    toggleBtn.addEventListener('click', () => {
        if (chatBox.classList.contains('hidden')) {
            openChat();
        } else {
            closeChat();
        }
    });

    closeBtn.addEventListener('click', () => {
        closeChat();
    });

    /* =======================================================
       ADD / REMOVE MESSAGE
    ======================================================= */
    function addMessage(text, type, id) {
        const div = document.createElement('div');
        div.className = type === 'user' ? 'jay-ai-user' : 'jay-ai-bot';

        if (id) {
            div.id = id;
        }

        div.innerHTML = text;
        messages.appendChild(div);

        requestAnimationFrame(() => {
            messages.scrollTop = messages.scrollHeight;
        });

        return div;
    }

    function removeMessage(id) {
        const element = document.getElementById(id);
        if (element) {
            element.remove();
        }
    }

    /* =======================================================
       SEND MESSAGE
    ======================================================= */
    function sendMessage() {
        const text = input.value.trim();
        if (!text) return;

        addMessage(text, 'user');
        input.value = '';
        processQuestion(text);
    }

    sendBtn.addEventListener('click', () => {
        sendMessage();
    });

    input.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
            event.preventDefault();
            sendMessage();
        }
    });

    /* =======================================================
       PROCESS QUESTION
    ======================================================= */
    function processQuestion(question) {
        const thinkingId = 'jay-ai-thinking';

        addMessage('Thinking...', 'bot', thinkingId);

        const delay = 650 + Math.floor(Math.random() * 550);

        setTimeout(() => {
            removeMessage(thinkingId);
            const reply = getReply(question);
            addMessage(reply, 'bot');
        }, delay);
    }

    /* =======================================================
       AI RESPONSES
    ======================================================= */
    function getReply(question) {
        const q = question.toLowerCase().trim();

        /* GREETINGS */
        if (
            /^(hi|hello|hey|good\s*(morning|afternoon|evening|day)|greetings|howdy|yo)\b/i.test(q) ||
            /^(hi|hello|hey)\s+(there|jay|assistant)?[!?.]*$/i.test(q)
        ) {
            return 'Good day! How can I help you?';
        }

        /* WHO ARE YOU */
        if (/(who are you|what are you|who'?s this|what is this|are you a bot|are you ai|are you real)/i.test(q)) {
            return 'I am the official AI assistant for JayWebDev. I can answer questions about Jay’s skills, services, and projects.';
        }

        /* WHO IS JAY */
        if (
            /(who is|who'?s|tell me about|about).*(jay|jaywebdev)/i.test(q) ||
            /^(who is jay|who'?s jay|about jay)/i.test(q)
        ) {
            return 'Jay is a professional web, app, and AI developer. He builds websites, web applications, mobile apps, custom software, and AI-powered solutions.';
        }

        /* WHAT DOES JAY DO */
        if (
            /(what does|what is|what do you|tell me what).*(jay|jaywebdev|he do|he does)/i.test(q) ||
            /what.*(jay|he).*(do|does|offer)/i.test(q)
        ) {
            return 'Jay works with HTML, CSS, JavaScript, React, Next.js, PHP, MySQL, and Python. He builds websites, web apps, applications, software, and AI-powered solutions.';
        }

        /* PROFESSIONAL */
        if (/(is jay|are you).*(developer|programmer|skilled|professional|good|experienced)/i.test(q)) {
            return 'Yes. Jay is a professional developer who builds modern websites, applications, software, and AI-powered solutions.';
        }

        if (/(professional|good|skilled|experienced|expert|reliable)/i.test(q)) {
            return 'Yes. Jay is a professional developer who builds modern websites, applications, software, and AI-powered solutions.';
        }

        /* PROJECTS / PORTFOLIO */
        if (
            /(project|projects|portfolio|work|works|built|builds|website.*built|app.*built|what.*built|what.*made|show.*work|show.*project|see.*work|see.*project|previous.*work|past.*work)/i.test(q)
        ) {
            return `
                <div>
                    <strong>Jay's Projects</strong><br><br>
                    You can explore Jay's projects, previous work, and development experience on the About page.<br><br>
                    <a href="services.html"
                       style="
                           display:inline-block;
                           padding:9px 14px;
                           background:#00eaff;
                           color:#000;
                           border-radius:8px;
                           text-decoration:none;
                           font-weight:600;
                       ">
                        View Projects →
                    </a>
                </div>
            `;
        }

        /* WEBSITE */
        if (
            /(build|make|create|develop).*(website|site|web page)/i.test(q) ||
            /can.*(you|jay).*(build|make).*(website|site)/i.test(q)
        ) {
            return 'Yes, Jay can build your website. Please contact him privately with your requirements to discuss the project and pricing.';
        }

        /* APP */
        if (
            /(build|make|create|develop).*(app|application|mobile)/i.test(q) ||
            /can.*(you|jay).*(build|make).*(app|application)/i.test(q)
        ) {
            return 'Yes, Jay can build applications. Contact him privately with your requirements to discuss the project and pricing.';
        }

        /* AI */
        if (
            /(ai|artificial intelligence|chatgpt|llm|machine learning).*(build|make|create|integrate|add|system|app|application)/i.test(q) ||
            /can.*(you|jay).*(build|make|add).*(ai|artificial intelligence)/i.test(q)
        ) {
            return 'Yes, Jay can build AI-powered applications and integrate AI into existing projects. Contact him privately to discuss your requirements and pricing.';
        }

        /* PRICING */
        if (/(how much|price|cost|pricing|quote|budget|charge)/i.test(q)) {
            return 'Pricing depends on the project requirements. Please contact Jay privately to discuss your project and get a suitable quote.';
        }

        /* SKILLS */
        if (/(what can|skills|what.*(jay|he).*(do|build|offer)|capabilities)/i.test(q)) {
            return 'Jay works with HTML, CSS, JavaScript, React, Next.js, PHP, MySQL, and Python. He builds websites, web apps, applications, software, and AI-powered solutions.';
        }

        /* SERVICES */
        if (/(services|what.*(do you|does jay).*(offer|provide)|what services)/i.test(q)) {
            return 'Jay offers website development, web apps, app development, custom software, AI solutions, frontend, backend, full-stack development, and database integration.';
        }

        /* APPOINTMENT */
        if (/(reserve|book|schedule|spot|slot|appointment|available time)/i.test(q)) {
            return 'I can’t reserve a spot directly, but you can contact Jay on the Contact page with your project details and he will get back to you.';
        }

        /* EXISTING PROJECT */
        if (
            /(existing|current|ongoing).*(project|website|app)/i.test(q) ||
            /work on.*(existing|my)/i.test(q)
        ) {
            return 'Yes, Jay can work on existing projects depending on the requirements. Please contact him with the project details.';
        }

        /* FIX / DEBUG */
        if (/(fix|debug|improve|update|maintain|bug|error)/i.test(q)) {
            return 'Yes, Jay can help with fixing and improving existing projects. Please contact him with the details.';
        }

        /* TECHNOLOGIES */
        if (/(technolog|stack|tools|languages|framework|what.*(tech|code|language))/i.test(q)) {
            return 'Jay works with HTML, CSS, JavaScript, React, Next.js, PHP, MySQL, and Python.';
        }

        /* HELP */
        if (/(can.*(you|jay).*(help|assist)|do you help)/i.test(q)) {
            return 'Yes, Jay can help with websites, web apps, mobile apps, custom software, and AI solutions. Please contact him with your project details.';
        }

        /* HIRE */
        if (/(hire|work with|need.*(developer|you|jay)|want.*(to work|you)|i want to hire)/i.test(q)) {
            return 'Sure. Please go to the Contact page and leave a message with your project details.';
        }

        /* CONTACT */
        if (/(contact|reach|email|message|available|availability|free|how.*(contact|reach))/i.test(q)) {
            return `
                <div>
                    Please go to the Contact page and leave a message with your requirements.<br><br>
                    <a href="contact.html"
                       style="
                           display:inline-block;
                           padding:9px 14px;
                           background:#00eaff;
                           color:#000;
                           border-radius:8px;
                           text-decoration:none;
                           font-weight:600;
                       ">
                        Contact Jay →
                    </a>
                </div>
            `;
        }

        /* BUSINESS */
        if (/(business|company|startup|enterprise)/i.test(q)) {
            return 'Yes. Jay can build digital solutions for businesses, including websites, apps, software, and AI-powered solutions.';
        }

        /* RELATED */
        if (/(jay|webdev|developer|website|app|ai|software|project|code|build)/i.test(q)) {
            return 'Jay is a web, app, and AI developer who builds modern digital solutions. For specific project details, please go to the Contact page.';
        }

        /* DEFAULT */
        return 'Please go to the Contact page and leave a message. Jay will be able to assist you there.';
    }

    /* =======================================================
       ESCAPE KEY
    ======================================================= */
    document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') {
            if (!chatBox.classList.contains('hidden')) {
                closeChat();
            }
        }
    });

})();
</script>

</body>
